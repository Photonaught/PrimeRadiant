description = "Financial analysis and modelling app"
requires-python = ">=3.11"
dependencies = ["plotly>=5.24"]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
